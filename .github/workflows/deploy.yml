name: Auto Deploy to Hugging Face and cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Build and Test Job
  build:
    name: Build Production Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application Bundle
        run: npm run build

      - name: Copy .htaccess to dist
        run: cp .htaccess dist/.htaccess || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 2

  # 2. Deploy to Hugging Face Spaces (Sync Repository)
  deploy-huggingface:
    name: Sync to Hugging Face Space
    needs: build
    runs-on: ubuntu-latest
    if: "${{ vars.HF_SPACE != '' || secrets.HF_TOKEN != '' }}"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME || vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE_NAME" ]; then
            echo "Skipping Hugging Face deployment: HF_TOKEN or HF_SPACE_NAME secret not configured."
            exit 0
          fi
          echo "Syncing repository to Hugging Face Space: $HF_SPACE_NAME..."
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git remote add hf "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE_NAME"
          git push -f hf HEAD:main

  # 3. Deploy to cPanel (FTP / FTPS / SFTP)
  deploy-cpanel:
    name: Deploy to cPanel via FTP
    needs: build
    runs-on: ubuntu-latest
    if: "${{ secrets.CPANEL_FTP_SERVER != '' }}"
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist

      - name: Upload to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ secrets.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.CPANEL_FTP_PORT || 21 }}
          local-dir: ./dist/
          server-dir: ${{ secrets.CPANEL_TARGET_DIR || 'public_html/' }}
          dangerous-clean-slate: false
